[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uhu"
version = "1.0.2"
description = "Minimalistic agentic coder for Ollama — transparent feedback loop of actions, observations, and model calls"
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.4.0",
    "requests>=2.28.0",
    "prompt_toolkit>=3.0",
    "setproctitle>=1.3.0",
]

[project.optional-dependencies]
search = ["ddgs>=9.0"]
pdf = ["markdown", "pymdown-extensions", "xhtml2pdf"]
browser = ["playwright", "playwright-stealth"]
calendar = ["google-api-python-client", "google-auth-httplib2", "google-auth-oauthlib"]
docx = ["markitdown"]
openai = ["openai>=1.0.0"]
clipboard = ["Pillow>=8.1.0"]
sysinfo = ["psutil>=5.9.0"]
balance = ["beautifulsoup4>=4.12.0"]
all = [
    "ddgs>=9.0",
    "markdown", "pymdown-extensions", "xhtml2pdf",
    "playwright", "playwright-stealth",
    "google-api-python-client", "google-auth-httplib2", "google-auth-oauthlib",
    "markitdown",
    "openai>=1.0.0",
    "Pillow>=8.1.0",
    "psutil>=5.9.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
huhu = "ollama_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ollama_agent*"]
